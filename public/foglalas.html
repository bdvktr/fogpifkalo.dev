<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Asztalfoglalás - BurgerBázis</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Itt nyugodtan bemásolhatod ugyanazt a navbar-t, mint az index.html-ben -->
    <!-- NAVBAR START -->
    <!-- ... -->
    <!-- NAVBAR END -->

    <main class="py-5">
      <div class="container">
        <h1 class="mb-3">Asztalfoglalás</h1>
        <p class="text-muted mb-4">
          Töltsd ki az alábbi űrlapot, és rögzítjük a foglalásod. A foglalás
          státusza kezdetben <strong>„függőben”</strong>, később az étterem
          visszaigazolja.
        </p>

        <div id="reservationMessage" class="mb-3"></div>

        <div class="card">
          <div class="card-body">
            <form id="reservationForm" class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Név</label>
                <input type="text" name="name" class="form-control" required />
              </div>

              <div class="col-md-6">
                <label class="form-label">Telefonszám</label>
                <input type="text" name="phone" class="form-control" required />
              </div>

              <div class="col-md-4">
                <label class="form-label">Dátum</label>
                <input type="date" name="date" class="form-control" required />
              </div>

              <div class="col-md-4">
                <label class="form-label">Időpont - mettől</label>
                <input
                  type="time"
                  name="timeFrom"
                  class="form-control"
                  required
                />
              </div>

              <div class="col-md-4">
                <label class="form-label">Időpont - meddig</label>
                <input
                  type="time"
                  name="timeTo"
                  class="form-control"
                  required
                />
              </div>

              <div class="col-md-4">
                <label class="form-label">Asztal száma</label>
                <select name="tableNumber" class="form-select" required>
                  <option value="">Válassz...</option>
                  <option value="1">1. asztal</option>
                  <option value="2">2. asztal</option>
                  <option value="3">3. asztal</option>
                  <option value="4">4. asztal</option>
                  <option value="5">5. asztal</option>
                  <option value="6">6. asztal</option>
                </select>
              </div>

              <div class="col-md-4">
                <label class="form-label">Létszám</label>
                <input
                  type="number"
                  name="peopleCount"
                  class="form-control"
                  min="1"
                  max="20"
                  required
                />
              </div>

              <div class="col-12">
                <label class="form-label">Megjegyzés (opcionális)</label>
                <textarea name="note" class="form-control" rows="3"></textarea>
              </div>

              <div class="col-12">
                <button type="submit" class="btn btn-primary">
                  Foglalás elküldése
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>

    <!-- Bootstrap JS (ha használod a navbarhoz, modálokhoz stb.) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Saját JS a foglaláshoz -->
    <script src="foglalas.js"></script>
  </body>
</html>
