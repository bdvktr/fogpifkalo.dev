<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BurgerBázis – Fizetés</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- NAVBAR (ugyanaz stílusban, mint az index/fiok) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="index.html">
          <i class="bi bi-egg-fried me-2" style="font-size: 1.4rem"></i>
          <span class="fw-bold">BurgerBázis</span>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navMenu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Főoldal</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="index.html#menu">Menü</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="fiok.html">Fiókom</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="py-5">
      <div class="container">
        <h1 class="h4 mb-4">Rendelés véglegesítése</h1>

        <div class="row g-4">
          <!-- Kosár összegzés -->
          <div class="col-lg-6">
            <div class="card shadow-sm">
              <div class="card-body">
                <h2 class="h6 mb-3">Kosarad tartalma</h2>
                <div id="checkoutCartItems" class="small text-muted">
                  Kosár betöltése...
                </div>
                <div class="mt-3 pt-3 border-top d-flex justify-content-between">
                  <strong>Összesen:</strong>
                  <strong id="checkoutTotal">0 Ft</strong>
                </div>
              </div>
            </div>
          </div>

          <!-- Szállítási adatok + fizetés -->
          <div class="col-lg-6">
            <div class="card shadow-sm">
              <div class="card-body">
                <h2 class="h6 mb-3">Szállítási adatok</h2>
                <form id="checkoutForm">
                  <div class="mb-2">
                    <label class="form-label">Név</label>
                    <input
                      type="text"
                      class="form-control form-control-sm"
                      id="shippingName"
                      required
                    />
                  </div>
                  <div class="mb-2">
                    <label class="form-label">Telefonszám</label>
                    <input
                      type="tel"
                      class="form-control form-control-sm"
                      id="shippingPhone"
                      required
                    />
                  </div>
                  <div class="mb-2">
                    <label class="form-label">Cím</label>
                    <input
                      type="text"
                      class="form-control form-control-sm"
                      id="shippingAddress"
                      placeholder="Irányítószám, város, utca, házszám"
                      required
                    />
                  </div>

                  <h3 class="h6 mt-3 mb-2">Fizetési mód</h3>
                  <div class="mb-2">
                    <div class="form-check">
                      <input
                        class="form-check-input"
                        type="radio"
                        name="paymentMethod"
                        id="payCash"
                        value="cash"
                        checked
                      />
                      <label class="form-check-label" for="payCash">
                        Készpénz a futárnál
                      </label>
                    </div>
                    <div class="form-check">
                      <input
                        class="form-check-input"
                        type="radio"
                        name="paymentMethod"
                        id="payCard"
                        value="card"
                      />
                      <label class="form-check-label" for="payCard">
                        Bankkártya a futárnál
                      </label>
                    </div>
                  </div>

                  <div class="mb-3">
                    <label class="form-label">Megjegyzés (opcionális)</label>
                    <textarea
                      id="orderNote"
                      class="form-control form-control-sm"
                      rows="2"
                      placeholder="Pl. csengő nem működik, hívj ha itt vagy."
                    ></textarea>
                  </div>

                  <div
                    id="checkoutError"
                    class="text-danger small mb-2 d-none"
                  ></div>

                  <button type="submit" class="btn btn-success w-100">
                    Rendelés elküldése
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- betöltjük a meglévő script.js-t, hogy a session, kosár ikon, stb. működjön -->
    <script src="script.js"></script>
    <script src="checkout.js"></script>
  </body>
</html>
