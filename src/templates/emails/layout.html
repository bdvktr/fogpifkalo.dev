<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>{{emailTitle}}</title>
  </head>
  <body style="margin:0; padding:0; background:#f4efe7; font-family:Arial, Helvetica, sans-serif; color:#151515;">
    <div style="display:none; max-height:0; overflow:hidden; opacity:0; color:transparent;">
      {{preheader}}
    </div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4efe7; margin:0; padding:28px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:640px; width:100%; background:#111111; border-radius:18px; overflow:hidden; box-shadow:0 18px 45px rgba(0,0,0,0.18);">
            <tr>
              <td align="center" style="padding:34px 28px 30px; background:#101010; border-bottom:2px solid #c58a24;">
                <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 auto 12px;">
                  <tr>
                    <td align="center" style="width:44px; height:34px;">
                      <div style="width:42px; height:28px; margin:0 auto; border:2px solid #d29a32; border-bottom:0; border-radius:22px 22px 8px 8px;"></div>
                      <div style="width:42px; height:3px; margin:2px auto; background:#d29a32; border-radius:6px;"></div>
                      <div style="width:42px; height:8px; margin:0 auto; border:2px solid #d29a32; border-top:0; border-radius:0 0 10px 10px;"></div>
                    </td>
                  </tr>
                </table>

                <div style="font-family:Georgia, 'Times New Roman', serif; font-size:42px; line-height:1; font-weight:700; color:#ffffff; letter-spacing:-0.5px;">
                  {{brandName}}
                </div>

                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:14px auto 0; max-width:340px;">
                  <tr>
                    <td align="center" style="padding:0 10px; color:#d29a32; font-size:11px; line-height:1.25; text-transform:uppercase; letter-spacing:1.6px; font-weight:700; white-space:nowrap;">{{brandSubtitle}}</td>
                  </tr>
                  <tr>
                    <td align="center" style="padding-top:8px;">
                      <div style="width:160px; max-width:100%; height:1px; background:#c58a24; margin:0 auto;"></div>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <tr>
              <td style="padding:26px 18px 0; background:#111111;">
                {{{body}}}
              </td>
            </tr>

            <tr>
              <td style="padding:22px 28px 30px; background:#111111;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-top:1px solid rgba(210,154,50,0.55); padding-top:22px;">
                  <tr>
                    <td style="color:#ffffff; font-family:Georgia, 'Times New Roman', serif; font-size:22px; font-weight:700; padding-bottom:16px;">
                      {{brandName}}
                    </td>
                  </tr>
                  <tr>
                    <td style="color:#d7d7d7; font-size:14px; line-height:1.8;">
                      <span style="color:#d29a32;">Cím:</span> {{restaurantAddress}}<br />
                      <span style="color:#d29a32;">Telefon:</span> {{restaurantPhone}}<br />
                      <span style="color:#d29a32;">Web:</span> {{restaurantWebsite}}
                    </td>
                  </tr>
                  <tr>
                    <td align="center" style="padding-top:22px; color:#8d8d8d; font-size:12px; line-height:1.6;">
                      Ez egy automatikus email, kérjük ne válaszolj erre az üzenetre.<br />
                      Kérdés esetén vedd fel velünk a kapcsolatot.
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
