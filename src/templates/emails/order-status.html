<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#ffffff; border-radius:16px; overflow:hidden; box-shadow:0 10px 32px rgba(0,0,0,0.16);">
  <tr>
    <td align="center" style="padding:34px 28px 18px;">
      <div style="display:inline-block; padding:9px 16px; border-radius:999px; border:1px solid {{statusBorderColor}}; background:{{statusBgColor}}; color:{{statusColor}}; font-size:13px; line-height:1; font-weight:700; text-transform:uppercase; letter-spacing:0.8px;">
        {{statusLabel}}
      </div>

      <h1 style="margin:22px 0 10px; font-family:Georgia, 'Times New Roman', serif; font-size:38px; line-height:1.12; color:#111111; letter-spacing:-0.5px;">
        {{title}}
      </h1>

      <p style="margin:0; color:#666666; font-size:17px; line-height:1.55;">
        {{intro}}
      </p>
    </td>
  </tr>

  <tr>
    <td style="padding:0 28px 24px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-top:1px solid #e7e0d5; border-bottom:1px solid #e7e0d5;">
        <tr>
          <td width="50%" style="padding:18px 14px 18px 0; border-right:1px solid #e7e0d5;">
            <div style="color:#707070; font-size:13px; line-height:1.4;">Rendelésszám:</div>
            <div style="color:#b87a14; font-size:22px; line-height:1.3; font-weight:700;">#{{orderId}}</div>
          </td>
          <td width="50%" style="padding:18px 0 18px 24px;">
            <div style="color:#707070; font-size:13px; line-height:1.4;">Állapot:</div>
            <div style="color:{{statusColor}}; font-size:20px; line-height:1.3; font-weight:700;">{{statusText}}</div>
          </td>
        </tr>
      </table>
    </td>
  </tr>

  <tr>
    <td style="padding:0 28px 24px;">
      <h2 style="margin:0 0 12px; color:#171717; font-size:18px; line-height:1.4;">
        Rendelés összegzése
      </h2>

      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border:1px solid #e8e1d7; border-radius:10px; overflow:hidden;">
        {{{summaryRows}}}
        <tr>
          <td style="padding:16px; background:#fbf8f2; border-top:2px solid #c58a24; color:#111111; font-size:18px; font-weight:700;">
            Végösszeg
          </td>
          <td align="right" style="padding:16px; background:#fbf8f2; border-top:2px solid #c58a24; color:#b87a14; font-size:28px; font-weight:800;">
            {{totalPrice}}
          </td>
        </tr>
      </table>
    </td>
  </tr>

  <tr>
    <td style="padding:0 28px 26px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
        <tr>
          <td valign="top" width="50%" style="padding:16px; border:1px solid #e8e1d7; border-radius:10px;">
            <div style="color:#171717; font-size:16px; line-height:1.4; font-weight:700; margin-bottom:6px;">Szállítási cím</div>
            <div style="color:#555555; font-size:14px; line-height:1.55;">{{shippingAddress}}</div>
          </td>
          <td width="16" style="font-size:0; line-height:0;">&nbsp;</td>
          <td valign="top" width="50%" style="padding:16px; border:1px solid #e8e1d7; border-radius:10px;">
            <div style="color:#171717; font-size:16px; line-height:1.4; font-weight:700; margin-bottom:6px;">Fizetés</div>
            <div style="color:#555555; font-size:14px; line-height:1.55;">{{paymentMethodLabel}}</div>
          </td>
        </tr>
      </table>
    </td>
  </tr>

  {{{noteBlock}}}

  <tr>
    <td align="center" style="padding:0 28px 34px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="width:100%;">
        <tr>
          <td align="center" bgcolor="#c58a24" style="border-radius:9px; background:#c58a24;">
            <a href="{{ctaUrl}}" style="display:block; width:100%; box-sizing:border-box; padding:15px 18px; color:#ffffff; text-decoration:none; font-size:16px; font-weight:700; border-radius:9px; outline:none;">{{ctaLabel}}</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
